name: Temporary APM APK build

on:
  push:
    branches:
      - apm-temp-build-20261007

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore APM source
        shell: bash
        run: |
          set -euxo pipefail
          cat apm-temp/part* > apm-temp/project.b64
          base64 -d apm-temp/project.b64 > apm-temp/project.zip
          unzip -t apm-temp/project.zip
          rm -rf apm-temp/project
          mkdir -p apm-temp/project
          unzip -q apm-temp/project.zip -d apm-temp/project

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Build debug APK
        working-directory: apm-temp/project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh apm-temp/project/app/build/outputs/apk/debug/app-debug.apk
          unzip -t apm-temp/project/app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: APM-Standalone-1.31-LogTools
          path: apm-temp/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
